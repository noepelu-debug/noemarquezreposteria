<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noe Márquez - Repostería Creativa</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #fff0f3;
      --card-bg: #ffffff;
      --primary: #d63384;
      --text-main: #4a4a4a;
      --border-color: #ffccd5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 90px; }
    header { background: #fff; text-align: center; padding: 20px 10px; border-bottom: 2px solid var(--border-color); }
    header h1 { color: var(--primary); font-size: 1.5rem; }
    header p { font-size: 0.85rem; color: #888; font-style: italic; }
    
    .container { max-width: 600px; margin: 0 auto; padding: 15px; }
    .greeting { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--border-color); }
    
    .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .card-btn { background: var(--card-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; font-weight: 600; color: var(--primary); }
    .card-btn:hover { background: #ffe6eb; }

    .section-content { display: none; background: #fff; padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; }
    .section-content.active { display: block; }

    form input, form select, form button { width: 100%; padding: 10px; margin: 5px 0 10px; border: 1px solid #ccc; border-radius: 6px; }
    form button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }

    .navbar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--border-color); }
    .nav-item { border: none; background: none; color: var(--text-main); font-size: 0.75rem; font-weight: bold; cursor: pointer; text-align: center; }
    .nav-item.active { color: var(--primary); }
  </style>
</head>
<body>

  <header>
    <h1>Noe Márquez</h1>
    <p>Repostería Creativa & Repostera Artesanal</p>
  </header>

  <div class="container">
    <div class="greeting">
      <h3>✨ ¡Hola Noe!</h3>
      <p>Resumen de tu emprendimiento hoy</p>
    </div>

    <!-- Menú Principal -->
    <div class="grid-menu">
      <button class="card-btn" onclick="showSection('pedidos')">📦 Pedidos</button>
      <button class="card-btn" onclick="showSection('productos')">🎂 Productos</button>
      <button class="card-btn" onclick="showSection('costos')">🧮 Costos</button>
      <button class="card-btn" onclick="showSection('recetas')">📖 Recetas</button>
    </div>

    <!-- Sección Pedidos -->
    <div id="sec-pedidos" class="section-content active">
      <h2>Gestión de Pedidos</h2>
      <form id="form-pedido" onsubmit="guardarPedido(event)">
        <input type="text" id="ped-cliente" placeholder="Nombre del Cliente" required>
        <input type="text" id="ped-producto" placeholder="Producto (ej. Torta Decorada)" required>
        <input type="date" id="ped-fecha" required>
        <input type="number" id="ped-monto" placeholder="Monto Total $" required>
        <button type="submit">Guardar Pedido</button>
      </form>
      <ul id="lista-pedidos" style="list-style: none; margin-top: 10px;"></ul>
    </div>

    <!-- Sección Productos -->
    <div id="sec-productos" class="section-content">
      <h2>Catálogo de Productos</h2>
      <form id="form-producto" onsubmit="guardarProducto(event)">
        <input type="text" id="prod-nombre" placeholder="Nombre del Producto" required>
        <input type="number" id="prod-precio" placeholder="Precio de Venta $" required>
        <button type="submit">Agregar Producto</button>
      </form>
      <ul id="lista-productos" style="list-style: none; margin-top: 10px;"></ul>
    </div>

    <!-- Sección Costos -->
    <div id="sec-costos" class="section-content">
      <h2>Calculadora de Costos</h2>
      <form onsubmit="calcularCosto(event)">
        <input type="number" id="c-ingredientes" placeholder="Costo de Ingredientes $" required>
        <input type="number" id="c-packaging" placeholder="Packaging / Cajas $" required>
        <input type="number" id="c-margen" placeholder="% Margen de Ganancia (ej. 50)" required>
        <button type="submit">Calcular Precio Sugerido</button>
      </form>
      <h3 id="res-costo" style="margin-top: 10px; color: var(--primary);"></h3>
    </div>

    <!-- Sección Recetas -->
    <div id="sec-recetas" class="section-content">
      <h2>Mis Recetas</h2>
      <p>Espacio para guardar tus ingredientes y preparaciones sencillas.</p>
    </div>
  </div>

  <!-- Barra de Navegación Inferior -->
  <div class="navbar">
    <button class="nav-item active" onclick="showSection('pedidos')">Pedidos</button>
    <button class="nav-item" onclick="showSection('productos')">Productos</button>
    <button class="nav-item" onclick="showSection('costos')">Costos</button>
    <button class="nav-item" onclick="showSection('recetas')">Recetas</button>
  </div>

  <script>
    // Cambio de secciones
    function showSection(id) {
      document.querySelectorAll('.section-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById('sec-' + id).classList.add('active');
    }

    // Datos y Memoria Local
    let pedidos = JSON.parse(localStorage.getItem('noe_pedidos')) || [];
    let productos = JSON.parse(localStorage.getItem('noe_productos')) || [];

    function renderPedidos() {
      const lista = document.getElementById('lista-pedidos');
      lista.innerHTML = pedidos.map(p => `
        <li style="border-bottom: 1px solid #eee; padding: 8px 0;">
          <strong>${p.cliente}</strong> - ${p.producto}<br>
          <small>Fecha: ${p.fecha} | Total: $${p.monto}</small>
        </li>
      `).join('');
    }

    function guardarPedido(e) {
      e.preventDefault();
      const nuevo = {
        cliente: document.getElementById('ped-cliente').value,
        producto: document.getElementById('ped-producto').value,
        fecha: document.getElementById('ped-fecha').value,
        monto: document.getElementById('ped-monto').value
      };
      pedidos.push(nuevo);
      localStorage.setItem('noe_pedidos', JSON.stringify(pedidos));
      renderPedidos();
      document.getElementById('form-pedido').reset();
    }

    function renderProductos() {
      const lista = document.getElementById('lista-productos');
      lista.innerHTML = productos.map(p => `
        <li style="border-bottom: 1px solid #eee; padding: 8px 0;">
          <strong>${p.nombre}</strong>: $${p.precio}
        </li>
      `).join('');
    }

    function guardarProducto(e) {
      e.preventDefault();
      const nuevo = {
        nombre: document.getElementById('prod-nombre').value,
        precio: document.getElementById('prod-precio').value
      };
      productos.push(nuevo);
      localStorage.setItem('noe_productos', JSON.stringify(productos));
      renderProductos();
      document.getElementById('form-producto').reset();
    }

    function calcularCosto(e) {
      e.preventDefault();
      const ing = parseFloat(document.getElementById('c-ingredientes').value) || 0;
      const pack = parseFloat(document.getElementById('c-packaging').value) || 0;
      const margen = parseFloat(document.getElementById('c-margen').value) || 0;
      
      const costoBase = ing + pack;
      const precioFinal = costoBase + (costoBase * (margen / 100));
      
      document.getElementById('res-costo').innerText = `Precio Sugerido: $${precioFinal.toFixed(2)}`;
    }

    // Carga Inicial
    renderPedidos();
    renderProductos();
  </script>
</body>
</html>
